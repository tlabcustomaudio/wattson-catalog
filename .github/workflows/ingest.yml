name: Merge contribution into the catalog
on:
  issues:
    types: [opened, edited, reopened]
permissions:
  contents: write
  issues: write
concurrency: catalog          # one contribution at a time: no concurrent writes to catalog.json
jobs:
  ingest:
    if: contains(github.event.issue.body, '"wattson"') && github.event.issue.state == 'open'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and merge
        id: ingest
        run: |
          set +e
          python3 tools/ingest.py "$GITHUB_EVENT_PATH" catalog.json > comment.md
          echo "rc=$?" >> "$GITHUB_OUTPUT"
      - name: Publish catalog.json
        if: steps.ingest.outputs.rc == '0'
        run: |
          git config user.name "wattson-catalog[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          # the same home re-sending identical values changes nothing: that's a success, not an error
          git diff --cached --quiet && exit 0
          git commit -m "Contribution #${{ github.event.issue.number }}"
          git push || (git pull --rebase && git push)
      - name: Reply and close
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$N" --body-file comment.md
          if [ "${{ steps.ingest.outputs.rc }}" = "0" ]; then
            gh issue close "$N" --reason completed
          else
            gh label create needs-review --color D93F0B --force >/dev/null
            gh issue edit "$N" --add-label needs-review
          fi
